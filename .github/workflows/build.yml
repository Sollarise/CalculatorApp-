name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/calculator-keystore.p12

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --warning-mode=none
        env:
          CALCULATOR_STORE_FILE: calculator-keystore.p12
          CALCULATOR_STORE_PASSWORD: ${{ secrets.CALCULATOR_STORE_PASSWORD }}
          CALCULATOR_KEY_ALIAS: ${{ secrets.CALCULATOR_KEY_ALIAS }}
          CALCULATOR_KEY_PASSWORD: ${{ secrets.CALCULATOR_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-release
          path: android/app/build/outputs/apk/release/app-release.apk